[project]
name = "8domains-audio-mlx"
version = "0.1.0"
# Italian narration: OmniVoice on MLX, kept apart from Kokoro's stack in the parent project.
# torch and transformers serve OmniVoice's reference-voice encoder and text tokenizer.
requires-python = ">=3.12,<3.13"
dependencies = [
    "mlx-audio>=0.4",
    "mlx-whisper>=0.4",
    "torch",
    "torchaudio",
    "transformers",
    "soundfile>=0.13",
    "pyyaml>=6.0",
    "numpy",
]

[tool.uv]
package = false
exclude-newer = "7 days"
